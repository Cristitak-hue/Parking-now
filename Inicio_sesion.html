    <div class="caja-login">

        </div>
        <div class="login">
            <h1>Inicia sesión</h1>
            <hr>
            <form id="login">
                <label for="email"> Correo Electronico</label><br><input type="email" id="email" placeholder="Example: username@Parkgin-now.com" class="input"><br>
                <p id="error-email"></p>
                <label for="contraseña">Contraseña</label><br>
                
                <div class="input-wrapper">
                    <input type="password" id="contraseña" placeholder="min. 8 caracteres" class="input">
                    <i class="fa-solid fa-eye" id="togglePassword"></i>
                </div>
                <p id="error-contraseña"></p>
                <button type="submit" id="botonEnviar">Siguiente</button><br>
                <a href="/Login-usuario.html">¿No tienes una cuenta? Registrate-now</a><br>
                <a href="/recuperar_contraseña.html ">Olvide mi contraseña</a><br>
            </form>
        </div>
    </div>
    <script src="/Javascript/Inicio_sesion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
