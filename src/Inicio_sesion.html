<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkgin-now Inicio sesión</title>
    <link rel="stylesheet" href="/CSS/Inicio_sesion.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="/Images/image.png" type="image/x-icon">
</head>
<body>
    <div class="caja-login">
        <div class="imagen">
            <img src="/Images/imagen_parqueadero.jpg" alt="Imagen imagen_parqueadero">
        </div>
        <div class="login">
            <h1>Inicia sesión</h1>
            <hr>
            <form id="login">
                <label for="email"> Correo Electronico</label><br><input type="text" id="email" placeholder="Example: username@Parkgin-now.com" class="input"><br>
                <p id="error-email"></p>
                <label for="contraseña">Contraseña</label><br><input type="password" id="contraseña" placeholder="min. 8 caracteres" class="input"><br>
                <p id="error-contraseña"></p>
                <button type="submit">Siguiente</button><br>
                <a href="/Login-usuario.html">¿No tienes una cuenta? Registrate-now</a><br>
                <a href="/recuperar_contraseña.html ">Olvide mi contraseña</a><br>
            </form>
        </div>
    </div>
    <script src="/Javascript/Inicio_sesion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
